name: Scrape Events and Deploy

on:
  schedule:
    # Run daily at 6 AM UTC (1 PM Bangkok time)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright aiohttp
          playwright install chromium
          playwright install-deps chromium

      - name: Restore Facebook session
        env:
          FB_SESSION: ${{ secrets.FB_SESSION }}
        run: |
          echo "$FB_SESSION" > scrapers/facebook_session.json

      - name: Run Facebook scraper (headless)
        run: |
          cd scrapers
          python headless_fb_scrape.py || echo "Scraping may have failed, checking for data..."

      - name: Update events.json if new data
        run: |
          if [ -f scrapers/scraped_events.json ]; then
            EVENT_COUNT=$(cat scrapers/scraped_events.json | python -c 'import json,sys; print(len(json.load(sys.stdin)))')
            if [ "$EVENT_COUNT" -gt 0 ]; then
              cp scrapers/scraped_events.json frontend/public/events.json
              echo "Updated events.json with $EVENT_COUNT events"
            else
              echo "No new events scraped, keeping existing data"
            fi
          else
            echo "No scraped_events.json found, keeping existing data"
          fi

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add frontend/public/events.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update events data [automated]"
            git push
          fi

      - name: Summary
        run: |
          echo "## Scrape Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f frontend/public/events.json ]; then
            COUNT=$(cat frontend/public/events.json | python -c 'import json,sys; print(len(json.load(sys.stdin)))')
            echo "Events in database: $COUNT" >> $GITHUB_STEP_SUMMARY
          fi
          echo "Vercel will auto-deploy on push" >> $GITHUB_STEP_SUMMARY
